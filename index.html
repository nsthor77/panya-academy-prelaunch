<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panya Platform</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    /* === PANYA BRAND COLORS === */
    --navy:#1E3A8A;
    --navy-dark:#172554;
    --blue:#1E40AF;
    --blue-light:#3B82F6;
    --sky:#DBEAFE;
    --sky-soft:#EFF6FF;
    --amber:#F59E0B;
    --amber-light:#FBBF24;
    --amber-soft:#FEF3C7;
    
    /* === NEUTRALS === */
    --bg:#F8FAFC;
    --surface:#FFFFFF;
    --border:#E2E8F0;
    --border-strong:#CBD5E1;
    --text:#0F172A;
    --text-soft:#475569;
    --text-muted:#94A3B8;
    
    /* === SEMANTIC === */
    --success:#10B981;
    --success-soft:#D1FAE5;
    --warning:#F59E0B;
    --warning-soft:#FEF3C7;
    --danger:#EF4444;
    --danger-soft:#FEE2E2;
    --info:#3B82F6;
    --info-soft:#DBEAFE;
    --purple:#8B5CF6;
    --purple-soft:#EDE9FE;
    
    --hover:#F1F5F9;
  }
  body{font-family:'IBM Plex Sans Thai','Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
  svg{display:inline-block;flex-shrink:0}

  /* ============================================
     LOGIN
     ============================================ */
  .login-screen{position:fixed;inset:0;background:linear-gradient(135deg,var(--navy) 0%,var(--blue) 50%,var(--blue-light) 100%);display:flex;align-items:center;justify-content:center;z-index:9999;padding:24px}
  .login-screen::before{content:"";position:absolute;top:-200px;right:-200px;width:500px;height:500px;background:rgba(251,191,36,.15);border-radius:50%;filter:blur(40px)}
  .login-screen::after{content:"";position:absolute;bottom:-200px;left:-200px;width:500px;height:500px;background:rgba(59,130,246,.20);border-radius:50%;filter:blur(40px)}
  .login-screen.hide{display:none}
  .login-card{max-width:440px;width:100%;background:var(--surface);border-radius:20px;padding:40px;box-shadow:0 30px 80px rgba(15,23,42,.30);position:relative;z-index:1}
  .login-logo{width:56px;height:56px;background:var(--navy);border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--amber);font-weight:800;font-size:30px;margin:0 auto 24px;font-family:'Inter',sans-serif;letter-spacing:-.04em;box-shadow:0 8px 24px rgba(30,58,138,.30)}
  .login-card h1{font-size:24px;font-weight:800;color:var(--text);margin-bottom:6px;letter-spacing:-.02em;text-align:center}
  .login-card .subtitle{text-align:center;color:var(--text-soft);margin-bottom:28px;font-size:14px}
  .role-list{display:flex;flex-direction:column;gap:8px}
  .role-btn{padding:14px 16px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface);cursor:pointer;transition:all .18s;text-align:left;font-family:inherit;display:flex;align-items:center;gap:12px;width:100%}
  .role-btn:hover{border-color:var(--blue);background:var(--sky-soft);transform:translateY(-1px)}
  .role-btn .icon-box{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .18s}
  .role-btn[data-role="admin"] .icon-box{background:var(--purple-soft);color:var(--purple)}
  .role-btn[data-role="teacher"] .icon-box{background:var(--success-soft);color:var(--success)}
  .role-btn[data-role="student"] .icon-box{background:var(--sky);color:var(--blue)}
  .role-btn[data-role="parent"] .icon-box{background:var(--amber-soft);color:var(--amber)}
  .role-btn .text{flex:1}
  .role-btn .name{font-weight:700;font-size:14px;color:var(--text)}
  .role-btn .desc{font-size:12px;color:var(--text-muted);margin-top:1px}
  .role-btn .arrow{color:var(--text-muted);transition:transform .18s}
  .role-btn:hover .arrow{transform:translateX(3px);color:var(--blue)}

  /* ============================================
     APP
     ============================================ */
  .app{display:none;min-height:100vh}
  .app.show{display:flex}

  /* ============================================
     SIDEBAR (Brand color top + clean below)
     ============================================ */
  .sidebar{width:248px;background:var(--surface);border-right:1px solid var(--border);position:fixed;top:0;left:0;height:100vh;display:flex;flex-direction:column;z-index:50;transition:transform .25s}
  .sidebar-top{padding:18px 18px;background:linear-gradient(135deg,var(--navy) 0%,var(--blue) 100%);color:#fff;display:flex;align-items:center;gap:11px;position:relative;overflow:hidden}
  .sidebar-top::after{content:"";position:absolute;top:-40px;right:-40px;width:120px;height:120px;background:rgba(251,191,36,.15);border-radius:50%}
  .sidebar-top .logo-mark{width:34px;height:34px;background:var(--amber);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--navy);font-weight:800;font-size:18px;font-family:'Inter',sans-serif;letter-spacing:-.03em;position:relative;z-index:1;box-shadow:0 4px 12px rgba(251,191,36,.30)}
  .sidebar-top .label{font-weight:800;font-size:16px;color:#fff;letter-spacing:-.01em;position:relative;z-index:1}
  .sidebar-top .label-sub{font-size:10px;color:var(--amber-light);font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-top:1px;position:relative;z-index:1}

  .sidebar-user{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
  .sidebar-user .avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;font-family:'Inter',sans-serif;color:#fff}
  .sidebar-user .name{font-weight:600;font-size:13px;color:var(--text);line-height:1.2;margin-bottom:1px}
  .sidebar-user .role-pill{display:inline-block;font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;letter-spacing:.04em;text-transform:uppercase}
  
  .sidebar-nav{padding:10px;flex:1;overflow-y:auto}
  .sidebar-section{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;padding:14px 12px 8px;font-weight:700}
  .sidebar-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--text-soft);font-weight:500;font-size:13px;transition:all .15s;text-decoration:none;margin-bottom:2px}
  .sidebar-item:hover{background:var(--hover);color:var(--text)}
  .sidebar-item.active{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;box-shadow:0 4px 14px rgba(30,64,175,.25)}
  .sidebar-item.active svg{color:#fff}
  .sidebar-item svg{color:var(--text-muted);transition:color .15s}
  .sidebar-item:hover svg{color:var(--blue)}
  .sidebar-item .badge{margin-left:auto;background:var(--amber);color:#fff;font-size:10px;padding:1px 6px;border-radius:99px;font-weight:700;min-width:18px;text-align:center;line-height:1.5}
  .sidebar-item.active .badge{background:#fff;color:var(--navy)}
  
  .sidebar-footer{padding:12px;border-top:1px solid var(--border)}
  .logout-btn{width:100%;padding:9px 11px;background:transparent;border:none;border-radius:7px;cursor:pointer;color:var(--text-soft);font-size:13px;font-weight:500;font-family:inherit;display:flex;align-items:center;gap:10px;text-align:left;transition:all .15s}
  .logout-btn:hover{background:var(--danger-soft);color:var(--danger)}

  /* ============================================
     MAIN
     ============================================ */
  .main{margin-left:248px;flex:1;min-height:100vh;max-width:calc(100vw - 248px)}
  .topbar{border-bottom:1px solid var(--border);padding:18px 32px;background:var(--surface);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:30}
  .topbar-left{display:flex;align-items:center;gap:14px}
  .menu-toggle{display:none;width:36px;height:36px;border:1px solid var(--border);border-radius:8px;background:var(--surface);cursor:pointer;align-items:center;justify-content:center;color:var(--text)}
  .topbar h1{font-size:20px;font-weight:700;color:var(--text);letter-spacing:-.02em}
  .topbar .subtitle{color:var(--text-muted);font-size:13px;margin-top:1px}
  .topbar-actions{display:flex;gap:8px;align-items:center}
  
  .content{padding:24px 32px;max-width:1320px}

  /* ============================================
     BUTTONS
     ============================================ */
  .btn{padding:9px 16px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;border:1.5px solid transparent;font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:all .15s;line-height:1.4;white-space:nowrap}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-primary:hover{background:var(--navy);transform:translateY(-1px);box-shadow:0 4px 12px rgba(30,64,175,.30)}
  .btn-amber{background:var(--amber);color:#fff}
  .btn-amber:hover{background:#D97706;transform:translateY(-1px);box-shadow:0 4px 12px rgba(245,158,11,.30)}
  .btn-ghost{background:var(--surface);color:var(--text);border-color:var(--border)}
  .btn-ghost:hover{background:var(--hover);border-color:var(--border-strong)}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:6px}

  /* ============================================
     CARDS
     ============================================ */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px;transition:all .15s}
  .card:hover{border-color:var(--border-strong)}
  .card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .card-title{font-size:14px;font-weight:700;color:var(--text);letter-spacing:-.01em}
  .card-link{font-size:12px;color:var(--blue);text-decoration:none;display:flex;align-items:center;gap:4px;font-weight:600;transition:color .12s}
  .card-link:hover{color:var(--navy)}

  /* ============================================
     STAT GRID (Colorful!)
     ============================================ */
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;transition:all .2s;position:relative;overflow:hidden}
  .stat-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--blue)}
  .stat-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(15,23,42,.06)}
  .stat-card.amber::before{background:var(--amber)}
  .stat-card.green::before{background:var(--success)}
  .stat-card.purple::before{background:var(--purple)}
  .stat-card.navy::before{background:var(--navy)}
  
  .stat-card .label-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .stat-card .label{font-size:12px;color:var(--text-soft);font-weight:600}
  .stat-card .stat-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--sky);color:var(--blue)}
  .stat-card.amber .stat-icon{background:var(--amber-soft);color:var(--amber)}
  .stat-card.green .stat-icon{background:var(--success-soft);color:var(--success)}
  .stat-card.purple .stat-icon{background:var(--purple-soft);color:var(--purple)}
  .stat-card.navy .stat-icon{background:var(--sky);color:var(--navy)}
  
  .stat-card .value{font-size:28px;font-weight:800;color:var(--text);letter-spacing:-.02em;line-height:1;margin-bottom:8px;font-family:'Inter',sans-serif}
  .stat-card .change{font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:4px;font-weight:500}
  .stat-card .change.up{color:var(--success)}
  .stat-card .change.down{color:var(--danger)}

  /* ============================================
     GRID
     ============================================ */
  .grid-2{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-bottom:18px}
  .grid-1-1{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}

  /* ============================================
     CHART (Brand colored)
     ============================================ */
  .chart{height:220px;display:flex;align-items:flex-end;gap:10px;padding-bottom:30px;position:relative;border-bottom:1px solid var(--border)}
  .chart-bar{flex:1;background:linear-gradient(to top,var(--navy),var(--blue-light));border-radius:6px 6px 0 0;position:relative;transition:all .3s;min-height:6px;cursor:pointer}
  .chart-bar:hover{background:linear-gradient(to top,var(--blue),var(--amber))}
  .chart-bar .val{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--text);white-space:nowrap}
  .chart-bar .lbl{position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--text-muted);white-space:nowrap;font-weight:500}

  /* ============================================
     LIST ITEMS (Colorful icons)
     ============================================ */
  .item-list{display:flex;flex-direction:column}
  .list-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
  .list-item:last-child{border-bottom:none}
  .list-item .item-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .list-item .item-icon.blue{background:var(--sky);color:var(--blue)}
  .list-item .item-icon.amber{background:var(--amber-soft);color:var(--amber)}
  .list-item .item-icon.green{background:var(--success-soft);color:var(--success)}
  .list-item .item-icon.purple{background:var(--purple-soft);color:var(--purple)}
  .list-item .item-text{flex:1;min-width:0}
  .list-item .item-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px}
  .list-item .item-meta{font-size:11px;color:var(--text-muted);font-weight:500}

  /* ============================================
     TABLE
     ============================================ */
  .table{width:100%;border-collapse:collapse;background:var(--surface)}
  .table th{text-align:left;padding:11px 14px;background:var(--bg);font-weight:600;font-size:11px;color:var(--text-soft);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border)}
  .table th:first-child{border-radius:8px 0 0 0}
  .table th:last-child{border-radius:0 8px 0 0}
  .table td{padding:13px 14px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text)}
  .table tr:last-child td{border-bottom:none}
  .table tr:hover td{background:var(--hover)}
  
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:600;letter-spacing:.01em}
  .pill.blue{background:var(--sky);color:var(--blue)}
  .pill.success{background:var(--success-soft);color:#047857}
  .pill.warning{background:var(--warning-soft);color:#92400E}
  .pill.danger{background:var(--danger-soft);color:#B91C1C}
  .pill.purple{background:var(--purple-soft);color:#6D28D9}
  .pill.amber{background:var(--amber-soft);color:#92400E}
  .pill.gray{background:var(--bg);color:var(--text-soft);border:1px solid var(--border)}
  .pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

  /* ============================================
     PROFILE (Brand gradient cover!)
     ============================================ */
  .profile-header{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:22px}
  .profile-cover{height:140px;background:linear-gradient(135deg,var(--navy) 0%,var(--blue) 50%,var(--blue-light) 100%);position:relative}
  .profile-cover::after{content:"";position:absolute;top:-50px;right:-50px;width:200px;height:200px;background:rgba(251,191,36,.20);border-radius:50%}
  .profile-cover::before{content:"";position:absolute;bottom:-100px;left:-50px;width:300px;height:300px;background:rgba(59,130,246,.25);border-radius:50%;filter:blur(40px)}
  .profile-body{padding:0 26px 24px;position:relative}
  .profile-avatar{width:94px;height:94px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--blue));color:var(--amber);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;border:5px solid var(--surface);margin-top:-50px;margin-bottom:14px;font-family:'Inter',sans-serif;letter-spacing:-.02em;box-shadow:0 8px 24px rgba(30,58,138,.20)}
  .profile-name{font-size:24px;font-weight:800;color:var(--text);letter-spacing:-.02em;margin-bottom:4px}
  .profile-title{color:var(--text-soft);font-size:14px;margin-bottom:14px}
  .profile-meta{display:flex;gap:20px;flex-wrap:wrap;font-size:13px;color:var(--text-soft);font-weight:500}
  .profile-meta span{display:flex;align-items:center;gap:6px}
  .profile-meta svg{color:var(--blue)}

  /* ============================================
     VIDEO GRID
     ============================================ */
  .video-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .video-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:all .2s}
  .video-card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(15,23,42,.10);border-color:var(--blue)}
  .video-thumb{aspect-ratio:16/9;background:linear-gradient(135deg,var(--navy),var(--blue));position:relative;display:flex;align-items:center;justify-content:center}
  .video-thumb .play-btn{width:54px;height:54px;border-radius:50%;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.15)}
  .video-thumb .duration{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.80);color:#fff;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:600}
  .video-info{padding:14px}
  .video-info h4{font-size:14px;font-weight:700;color:var(--text);margin-bottom:5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .video-info .meta{font-size:11px;color:var(--text-muted);font-weight:500}
  .video-upload-card{display:flex;align-items:center;justify-content:center;flex-direction:column;border:2px dashed var(--blue);background:var(--sky-soft);min-height:200px;color:var(--blue);cursor:pointer;transition:all .2s;border-radius:12px;padding:20px}
  .video-upload-card:hover{background:var(--sky);transform:translateY(-2px)}
  .video-upload-card .upload-icon{margin-bottom:10px}
  .video-upload-card .upload-title{font-size:14px;font-weight:700;margin-bottom:4px}
  .video-upload-card .upload-meta{font-size:11px;color:var(--text-soft)}

  /* ============================================
     STUDENT PROGRESS (Brand colors!)
     ============================================ */
  .progress-card{background:linear-gradient(135deg,var(--navy) 0%,var(--blue) 60%,var(--blue-light) 100%);color:#fff;padding:28px;border-radius:16px;margin-bottom:22px;position:relative;overflow:hidden;box-shadow:0 12px 32px rgba(30,58,138,.20)}
  .progress-card::before{content:"";position:absolute;top:-100px;right:-100px;width:300px;height:300px;background:rgba(251,191,36,.20);border-radius:50%;filter:blur(40px)}
  .progress-card::after{content:"";position:absolute;bottom:-100px;left:-100px;width:300px;height:300px;background:rgba(59,130,246,.30);border-radius:50%;filter:blur(40px)}
  .progress-row{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:18px;position:relative;z-index:1}
  .progress-level{font-size:11px;color:var(--amber-light);text-transform:uppercase;letter-spacing:.10em;margin-bottom:6px;font-weight:700}
  .progress-title{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px;color:#fff}
  .progress-next{font-size:13px;color:rgba(255,255,255,.80)}
  .btn-on-dark{padding:8px 14px;border:1px solid rgba(255,255,255,.20);background:rgba(255,255,255,.10);color:#fff;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:all .15s;backdrop-filter:blur(10px)}
  .btn-on-dark:hover{background:var(--amber);border-color:var(--amber);color:var(--navy)}
  .xp-bar{height:8px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden;margin-bottom:16px;position:relative;z-index:1}
  .xp-fill{height:100%;background:linear-gradient(to right,var(--amber-light),var(--amber));border-radius:99px;transition:width .6s;box-shadow:0 2px 8px rgba(251,191,36,.40)}
  .progress-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(255,255,255,.10);border-radius:10px;overflow:hidden;position:relative;z-index:1}
  .p-stat{background:rgba(0,0,0,.15);padding:14px 16px;backdrop-filter:blur(10px)}
  .p-stat .p-stat-label{font-size:10px;color:rgba(255,255,255,.60);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;font-weight:700}
  .p-stat .p-stat-value{font-size:20px;font-weight:800;letter-spacing:-.01em;font-family:'Inter',sans-serif;color:#fff;display:flex;align-items:center;gap:6px}
  .p-stat .p-stat-value .amber{color:var(--amber-light)}

  /* ============================================
     COURSE LIST
     ============================================ */
  .course-list{display:flex;flex-direction:column;gap:10px}
  .course-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;display:flex;gap:14px;align-items:center;cursor:pointer;transition:all .15s}
  .course-item:hover{border-color:var(--blue);background:var(--sky-soft);transform:translateX(2px)}
  .course-thumb{width:48px;height:48px;border-radius:10px;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;font-size:16px;font-family:'Inter',sans-serif}
  .course-thumb.blue{background:linear-gradient(135deg,var(--navy),var(--blue))}
  .course-thumb.green{background:linear-gradient(135deg,#059669,var(--success))}
  .course-thumb.purple{background:linear-gradient(135deg,#6D28D9,var(--purple))}
  .course-thumb.amber{background:linear-gradient(135deg,#D97706,var(--amber))}
  .course-info{flex:1;min-width:0}
  .course-title{font-weight:700;color:var(--text);font-size:14px;margin-bottom:3px}
  .course-meta{font-size:12px;color:var(--text-muted);margin-bottom:7px;font-weight:500}
  .course-progress{display:flex;align-items:center;gap:10px}
  .progress-bar{flex:1;height:5px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
  .progress-fill-line{height:100%;background:linear-gradient(to right,var(--blue),var(--blue-light));border-radius:99px}
  .progress-fill-line.amber{background:linear-gradient(to right,var(--amber),var(--amber-light))}
  .progress-fill-line.green{background:linear-gradient(to right,#059669,var(--success))}
  .progress-text{font-size:11px;color:var(--text-soft);font-weight:600;flex-shrink:0;font-variant-numeric:tabular-nums}

  /* ============================================
     ACHIEVEMENTS (with brand colors!)
     ============================================ */
  .achievement-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
  .achievement{aspect-ratio:1;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;text-align:center;cursor:pointer;transition:all .2s;position:relative}
  .achievement:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,23,42,.08)}
  .achievement.locked{opacity:.5;background:var(--bg)}
  .achievement.earned{background:linear-gradient(135deg,var(--amber-soft),var(--amber-light));border-color:var(--amber);color:#92400E}
  .achievement.earned.blue{background:linear-gradient(135deg,var(--sky),var(--blue-light));border-color:var(--blue);color:#fff}
  .achievement.earned.purple{background:linear-gradient(135deg,var(--purple-soft),var(--purple));border-color:var(--purple);color:#fff}
  .achievement.earned.green{background:linear-gradient(135deg,var(--success-soft),var(--success));border-color:var(--success);color:#fff}
  .achievement .ach-icon{margin-bottom:5px;color:inherit}
  .achievement .ach-name{font-size:10px;font-weight:700;line-height:1.2;color:inherit}

  /* ============================================
     REWARDS
     ============================================ */
  .reward-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .reward-card{background:var(--surface);border:1.5px dashed var(--amber);border-radius:12px;padding:20px;transition:all .2s;position:relative;overflow:hidden}
  .reward-card.amber-fill{background:linear-gradient(135deg,var(--amber-soft),#FED7AA);border-style:solid}
  .reward-card.blue-fill{background:linear-gradient(135deg,var(--sky),var(--sky-soft));border-color:var(--blue);border-style:solid}
  .reward-card.purple-fill{background:linear-gradient(135deg,var(--purple-soft),#DDD6FE);border-color:var(--purple);border-style:solid}
  .reward-card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(15,23,42,.08)}
  .reward-card .reward-amount{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px;font-family:'Inter',sans-serif}
  .reward-card.amber-fill .reward-amount{color:#92400E}
  .reward-card.blue-fill .reward-amount{color:var(--navy)}
  .reward-card.purple-fill .reward-amount{color:#6D28D9}
  .reward-card .reward-label{font-size:12px;color:var(--text-soft);margin-bottom:10px;font-weight:600}
  .reward-card .reward-expires{font-size:11px;color:var(--text-muted);margin-bottom:14px}
  .reward-card.locked{opacity:.55;border-color:var(--border)}

  /* ============================================
     MOBILE
     ============================================ */
  @media(max-width:900px){
    .sidebar{transform:translateX(-100%);box-shadow:0 0 50px rgba(0,0,0,.15)}
    .sidebar.show{transform:translateX(0)}
    .main{margin-left:0;max-width:100vw}
    .menu-toggle{display:flex}
    .topbar{padding:14px 18px}
    .content{padding:18px}
    .stat-grid{grid-template-columns:repeat(2,1fr)}
    .grid-2,.grid-1-1{grid-template-columns:1fr}
    .video-grid{grid-template-columns:1fr}
    .achievement-grid{grid-template-columns:repeat(4,1fr)}
    .reward-grid{grid-template-columns:1fr}
    .progress-stats{grid-template-columns:repeat(2,1fr)}
  }

  /* Demo bar */
  .demo-bar{position:fixed;top:0;left:0;right:0;background:linear-gradient(90deg,var(--navy),var(--blue));color:#fff;text-align:center;padding:7px;font-size:11px;font-weight:600;z-index:100;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:8px}
  .demo-bar a{color:var(--amber-light);text-decoration:underline;cursor:pointer;font-weight:700}
  .demo-bar .dot{width:6px;height:6px;border-radius:50%;background:var(--amber);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  body.has-banner{padding-top:30px}
  body.has-banner .sidebar{top:30px;height:calc(100vh - 30px)}
  body.has-banner .topbar{top:30px}
</style>

  document.body.classList.add('has-banner');

  navigate('dashboard');
}

function logout(){
  document.getElementById('loginScreen').classList.remove('hide');
  document.getElementById('app').classList.remove('show');
  document.getElementById('demoBar').style.display = 'none';
  document.body.classList.remove('has-banner');
  currentRole = null;
}

function navigate(page){
  currentPage = page;
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
  document.querySelector(`[data-page="${page}"]`)?.classList.add('active');
  renderPage(page);
  document.getElementById('sidebar').classList.remove('show');
}

function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('show'); }

function renderSidebar(){
  const role = ROLES[currentRole];
  document.getElementById('sidebarUser').innerHTML = `
    <div class="avatar" style="background:${role.avatarColor}">${role.initial}</div>
    <div>
      <div class="name">${role.name}</div>
      <span class="role-pill pill ${role.pillColor}">${role.label}</span>
    </div>
  `;
  const nav = document.getElementById('sidebarNav');
  nav.innerHTML = MENUS[currentRole].map(m => {
    if(m.section) return `<div class="sidebar-section">${m.section}</div>`;
    return `<a class="sidebar-item" data-page="${m.page}" onclick="navigate('${m.page}')">${svgIcon(m.icon, 17)}<span>${m.label}</span>${m.badge ? `<span class="badge">${m.badge}</span>` : ''}</a>`;
  }).join('');
}

function topbar(title, subtitle = '', actions = ''){
  return `
    <div class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" onclick="toggleSidebar()">${svgIcon('i-menu', 18)}</button>
        <div>
          <h1>${title}</h1>
          ${subtitle ? `<div class="subtitle">${subtitle}</div>` : ''}
        </div>
      </div>
      <div class="topbar-actions">${actions}</div>
    </div>
  `;
}

function renderPage(page){
  const fn = window[`render_${currentRole}_${page}`];
  document.getElementById('topbar').innerHTML = '';
  document.getElementById('content').innerHTML = fn ? fn() : comingSoon(page);
}

function comingSoon(page){
  document.getElementById('topbar').innerHTML = topbar(page.charAt(0).toUpperCase() + page.slice(1));
  return `<div class="card" style="text-align:center;padding:60px;background:linear-gradient(135deg,var(--sky-soft),var(--surface));border:1px dashed var(--blue)"><div style="color:var(--blue);margin-bottom:14px">${svgIcon('i-rocket', 40)}</div><h3 style="font-size:18px;color:var(--text);margin-bottom:6px">Coming in Sprint 2-3</h3><p style="color:var(--text-soft);font-size:13px">หน้านี้จะเปิดใช้งานหลังจาก Foundation พร้อม</p></div>`;
