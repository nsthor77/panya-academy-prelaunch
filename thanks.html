<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ขอบคุณ! · Panya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'IBM Plex Sans Thai', 'Plus Jakarta Sans', system-ui, sans-serif;
    background: linear-gradient(135deg, #1E3A8A, #1E40AF);
    color: white;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
  }
  .box {
    max-width: 480px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 48px 36px;
    border-radius: 20px;
  }
  .check {
    width: 72px;
    height: 72px;
    margin: 0 auto 20px;
    background: rgba(16, 185, 129, 0.2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    color: #10B981;
  }
  h1 {
    font-size: 32px;
    margin-bottom: 16px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  p {
    color: rgba(255, 255, 255, 0.85);
    margin-bottom: 28px;
    font-size: 16px;
    line-height: 1.7;
  }
  .home-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: #F59E0B;
    text-decoration: none;
    font-weight: 600;
    padding: 12px 24px;
    border: 1.5px solid #F59E0B;
    border-radius: 10px;
    transition: all 0.2s;
  }
  .home-link:hover {
    background: #F59E0B;
    color: #0F172A;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="check">✓</div>
    <h1>ขอบคุณครับ!</h1>
    <p>เราได้รับ email ของคุณแล้ว — จะแจ้งเตือนทันทีที่ Panya เปิดตัว และจะส่ง code ส่วนลด 50% ให้ก่อนใคร</p>
    <a href="/" class="home-link">← กลับหน้าหลัก</a>
  </div>
</body>
</html>
